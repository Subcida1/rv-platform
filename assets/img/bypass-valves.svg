<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Diagram of a three valve water heater bypass system">
  <rect width="640" height="300" fill="#f7f8fb" rx="14"/>
  <!-- water heater tank -->
  <rect x="430" y="60" width="120" height="180" rx="12" fill="#dbe9f7" stroke="#4a8fc8" stroke-width="2.5"/>
  <text x="490" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#28527a">Water</text>
  <text x="490" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#28527a">Heater</text>
  <text x="490" y="178" text-anchor="middle" font-size="12" fill="#28527a">tank</text>
  <!-- cold inlet line (top) -->
  <line x1="40" y1="80" x2="430" y2="80" stroke="#3b82f6" stroke-width="5"/>
  <text x="44" y="68" font-size="13" font-weight="700" fill="#3b82f6">Cold supply</text>
  <!-- hot outlet line (bottom) -->
  <line x1="430" y1="220" x2="40" y2="220" stroke="#ef4444" stroke-width="5"/>
  <text x="44" y="240" font-size="13" font-weight="700" fill="#ef4444">Hot out to faucets</text>
  <!-- bypass loop -->
  <line x1="200" y1="80" x2="200" y2="220" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8,6"/>
  <text x="170" y="152" font-size="12" font-weight="700" fill="#8b5cf6" transform="rotate(-90 170 152)">bypass loop</text>
  <!-- valve 1 (inlet) -->
  <g>
    <line x1="150" y1="70" x2="150" y2="90" stroke="#1f2937" stroke-width="3"/>
    <circle cx="150" cy="80" r="8" fill="#fff" stroke="#1f2937" stroke-width="2"/>
    <text x="132" y="60" font-size="12" font-weight="700" fill="#dc2626">INLET</text>
    <text x="132" y="74" font-size="11" fill="#dc2626">CLOSED</text>
  </g>
  <!-- valve on bypass -->
  <g>
    <line x1="190" y1="80" x2="210" y2="80" stroke="#1f2937" stroke-width="3"/>
    <circle cx="200" cy="80" r="8" fill="#fff" stroke="#1f2937" stroke-width="2"/>
  </g>
  <!-- valve 2 (outlet) -->
  <g>
    <line x1="280" y1="210" x2="280" y2="230" stroke="#1f2937" stroke-width="3"/>
    <circle cx="280" cy="220" r="8" fill="#fff" stroke="#1f2937" stroke-width="2"/>
    <text x="300" y="212" font-size="12" font-weight="700" fill="#dc2626">OUTLET</text>
    <text x="300" y="226" font-size="11" fill="#dc2626">CLOSED</text>
  </g>
  <text x="320" y="40" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Three valve bypass: inlet and outlet closed, bypass loop open</text>
  <text x="320" y="285" text-anchor="middle" font-size="11" fill="#6b7280">Antifreeze flows around the tank instead of into it, saving several gallons.</text>
</svg>
