<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Diagram of a three valve RV water heater bypass system">
  <rect width="720" height="340" fill="#f7f8fb" rx="14"/>
  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Three valve water heater bypass: winter position</text>
  <!-- Water heater tank -->
  <rect x="520" y="80" width="150" height="200" rx="14" fill="#dbe9f7" stroke="#4a8fc8" stroke-width="3"/>
  <text x="595" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#28527a">Water</text>
  <text x="595" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#28527a">Heater</text>
  <text x="595" y="205" text-anchor="middle" font-size="12" fill="#28527a">tank</text>
  <!-- Hot outlet top of tank, going LEFT to faucets -->
  <line x1="520" y1="105" x2="60" y2="105" stroke="#ef4444" stroke-width="6"/>
  <text x="66" y="92" font-size="13" font-weight="800" fill="#ef4444">Hot line to faucets</text>
  <!-- Cold inlet bottom of tank, coming FROM LEFT -->
  <line x1="60" y1="255" x2="520" y2="255" stroke="#3b82f6" stroke-width="6"/>
  <text x="66" y="280" font-size="13" font-weight="800" fill="#3b82f6">Cold supply in (bottom inlet)</text>
  <!-- Bypass loop connecting cold line to hot line, vertical on the left side -->
  <line x1="200" y1="105" x2="200" y2="255" stroke="#8b5cf6" stroke-width="6" stroke-dasharray="10,8"/>
  <text x="120" y="182" font-size="13" font-weight="800" fill="#8b5cf6">bypass loop</text>
  <!-- Valve A: cold inlet, closed (perpendicular to line) -->
  <line x1="330" y1="245" x2="330" y2="265" stroke="#1f2937" stroke-width="4"/>
  <circle cx="330" cy="255" r="9" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="352" y="248" font-size="12" font-weight="800" fill="#dc2626">COLD VALVE</text>
  <text x="352" y="263" font-size="11" font-weight="700" fill="#dc2626">CLOSED (perpendicular)</text>
  <!-- Valve B: bypass, open (parallel to line) -->
  <line x1="192" y1="105" x2="208" y2="105" stroke="#1f2937" stroke-width="4"/>
  <circle cx="200" cy="105" r="9" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="215" y="76" font-size="12" font-weight="800" fill="#16a34a">BYPASS VALVE</text>
  <text x="215" y="91" font-size="11" font-weight="700" fill="#16a34a">OPEN (parallel)</text>
  <!-- Valve C: hot outlet, closed -->
  <line x1="430" y1="95" x2="430" y2="115" stroke="#1f2937" stroke-width="4"/>
  <circle cx="430" cy="105" r="9" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="452" y="98" font-size="12" font-weight="800" fill="#dc2626">HOT VALVE</text>
  <text x="452" y="113" font-size="11" font-weight="700" fill="#dc2626">CLOSED (perpendicular)</text>
  <!-- Arrow showing flow around tank -->
  <path d="M 200 110 C 200 140 170 140 170 170 C 170 210 190 220 200 248" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arr)" opacity="0.7"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b5cf6"/></marker></defs>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#374151">Cold water enters the bottom of the tank, hot water leaves the top. With both line valves closed and the bypass open, flow routes past the tank.</text>
</svg>
