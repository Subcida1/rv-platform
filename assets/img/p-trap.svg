<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Diagram of a sink P-trap filled with antifreeze">
  <rect width="640" height="300" fill="#f7f8fb" rx="14"/>
  <!-- sink -->
  <rect x="180" y="30" width="280" height="40" rx="10" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <text x="320" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Sink</text>
  <!-- drain stub -->
  <rect x="300" y="70" width="40" height="30" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-size="10" fill="#3730a3">drain</text>
  <!-- P trap -->
  <path d="M 320 100 L 320 150 C 320 170 300 170 280 170 L 240 170 C 220 170 220 190 240 190 L 280 190" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linejoin="round"/>
  <text x="188" y="180" font-size="12" font-weight="700" fill="#8b5cf6">P-trap, the curved pipe that holds water</text>
  <!-- antifreeze fill inside -->
  <path d="M 312 100 L 312 152 C 312 162 302 162 292 162 L 288 162" fill="none" stroke="#ec4899" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>
  <text x="60" y="235" font-size="13" font-weight="700" fill="#ec4899">Pink antifreeze fills the trap so the</text>
  <text x="60" y="253" font-size="13" font-weight="700" fill="#ec4899">water cannot freeze and crack the pipe</text>
  <!-- wall pipe -->
  <line x1="240" y1="190" x2="170" y2="190" stroke="#9ca3af" stroke-width="6"/>
  <text x="150" y="180" font-size="11" fill="#6b7280">to wall drain</text>
</svg>
