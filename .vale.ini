; Vale -- prose linting for the site's written content.
;
; WHY VALE AND NOT ONLY house-style.py. house-style.py enforces OUR ten rules and nothing else,
; in Python, with no scope awareness. Vale adds a config format, markup-aware scoping (a rule can
; target headings only, and code is skipped), and roughly a hundred rules written by people who do
; documentation professionally -- Microsoft, Google, proselint, write-good, alex.
;
; WHAT VALE CANNOT DO, measured in its own documentation before adopting it: there is no entity
; recognition and no entailment in it. So "is this sentence an unnamed authority?" and "is this an
; unsourced prevalence claim?" are NOT things it can judge -- only crude lexical proxies. Those
; two stay in house-style.py, which is kept as the floor rather than replaced.
;
; Styles are fetched, not vendored: `vale sync`. They are gitignored because they are a dependency,
; not content.

StylesPath = .vale/styles
MinAlertLevel = warning

Packages = RedHat, proselint, write-good, alex

; REDHAT REPLACES MICROSOFT, and it is a genre match rather than a preference. Red Hat's package is
; built for technical documentation, and four of its rules land on house rules this site already
; keeps by hand:
;   RedHat.EmDash              bans the em dash CHARACTER (Google's rule only checks spacing around
;                              one). This site bans em and en dashes outright.
;   RedHat.Contractions        FORBIDS contractions -- "do not" not "don't", which is what a safety
;                              instruction wants. Microsoft's package DEMANDS the opposite.
;   RedHat.SelfReferentialText flags "this topic / this section". This site bans page self-reference.
;   RedHat.SimpleWords         plain-language swaps: utilize -> use, commence -> begin, prior to ->
;                              before.
; Microsoft went the other way on every one of those, which is why it is gone.

; VALE WAS LINTING THE JSON-LD AS PROSE. All twelve alex.Ablist findings pointed inside
; <script type="application/ld+json"> blocks -- the spans read "@context":"https://schema.org",
; "headline", "description". That is machine-readable schema, not a sentence a reader sees, and
; flagging it is pure noise. SkippedScopes drops whole blocks before any rule runs.
; WHAT VALE IS RUN ON, after trying the alternative. It lints the page HTML, and it reads the
; JSON-LD inside <script> blocks as prose. Three attempts to make it skip those failed --
; SkippedScopes = script, IgnoredScopes = script, SkippedScopes = script.html -- so the alternative
; was to lint scripts/export-prose.py's output instead. That was measured and rejected: it does
; not remove those findings and it ADDS 49 Microsoft.Spacing artifacts caused by the export's own
; formatting. Linting the HTML stays.

[*.html]
; REDHAT, NOT MICROSOFT. The comment above records the swap -- Red Hat's package is built for
; technical documentation and lands on four house rules this site keeps by hand, while Microsoft
; demands the opposite on every one of them. The swap was made in `Packages` and NOT here, so
; `BasedOnStyles` kept naming a package that `vale sync` never downloads. Vale then stopped with
;   E100 [loadStyles] style 'Microsoft' does not exist on StylesPath
; and produced no findings at all -- an error where a lint report should have been. Found
; 2026-10-05 while tracing the weekly full-checks failure. **A rename applied to one key and not
; the other is a config that cannot run.**
BasedOnStyles = RedHat, proselint, write-good, alex

; RULES TURNED OFF, AND WHY. These are not defects, they are the community style guides
; disagreeing with a deliberate house voice, and a check that flags correct writing is worse than
; no check because it teaches the reader to ignore the output.
;
;   Microsoft.Contractions -- insists on "they're" and "don't". Technical and SAFETY instructions
;     are clearer uncontracted: "do not remove the relief valve" is not a style miss.
;   Microsoft.FirstPerson, Microsoft.Passive -- "the fuse is rated at 20 amps" is the correct
;     construction here; the agent is not the subject of a fuse rating.
;   write-good.Passive, write-good.TooWordy -- the same problem, and TooWordy fires on "it is",
;     which is ordinary English.
;
; WHAT IS LEFT is the set that finds real things: Microsoft.Terms and Spelling, proselint's
; cliches/weasel-words/redundancy, alex's insensitive language, and write-good's weasel and
; cliches.
; NOISE, measured rather than assumed. Run across 25 guides on 2026-09-26, the published packages
; produced 1,082 findings, and the breakdown said what they were:
;   alex.ProfanityUnlikely 347 + ProfanityMaybe 64 + ProfanityLikely 27 = 438, from ONE family of
;     rules built to catch accidental profanity in general prose, and not adapted to this subject.
;     CORRECTED 2026-09-27 after reading the released rule files instead of inferring from the rule
;     names: "hook" is in ProfanityUnlikely, "screw" is in ProfanityMaybe, and "ball" and
;     "stopcock" are in NEITHER -- I had cited them as examples without opening the token list.
;     The substance stands (the lists are over-broad for RV content); two of my four examples were
;     invented.
;   Microsoft.Adverbs 177, HeadingAcronyms 64, AMPM 56, write-good.So 27 -- style preferences from
;     a documentation voice that is not ours.
;   WHAT SURVIVES and is worth reading: alex.Condescending 57 ("simply", "just", "obviously" --
;     genuinely wrong at a stuck reader), write-good.Weasel 100, Microsoft.Terms 40,
;     proselint.Cliches 2.
;
; Two of those four overlap house-style.py already, which is the honest size of what Vale adds here:
; a handful of rules, not a hundred.
; SECOND TUNING PASS, each rule sampled before switching it off. These either flag CORRECT
; writing or they are Microsoft product terminology that has no meaning for a maintenance site:
;
;   alex.Race -- fires on "master". In a trailer-brakes guide that is the MASTER CYLINDER, the
;     correct technical name for the part. Three instances, all of them that.
;   alex.Suicide -- fires in a tyre guide on an innocent phrase. Nothing in our content is
;     remotely related to its subject.
;   Microsoft.Terms -- demands "specification" over "spec" and "afterward" over "afterwards".
;     Both pairs are fine English and the shorter one is plainer, which is this site's voice.
;   Microsoft.UIVerbs -- wants "select" where we write "click". Clicking a breaker is clicking.
;   Microsoft.We -- flags "we" and "our". First-person plural is a deliberate voice choice here,
;     not a defect, and the rule exists for Microsoft's own documentation style.
; THIRD PASS -- every rule below is a FORMATTING CONVENTION of a different house style, sampled
; before switching off, not assumed:
;   Microsoft.Units  -- "Don't spell out the number in 'fourteen inches'". Microsoft's docs say
;     use numerals; this site writes prose, where "two inches" reads better. A choice, not a fault.
;   Microsoft.HeadingPunctuation / HeadingColons -- no end punctuation in headings. Our headings
;     are allowed to be questions, which is the whole point of an FAQ-shaped page.
;   proselint.Typography / Microsoft.Ellipses / Quotes -- want the single '…' character and
;     curly quotes. Three dots are unambiguous everywhere and survive every encoding.
;   Microsoft.Auto / DateFormat / Percentages / Negative / Plurals / GeneralURL / BiasFree --
;     Microsoft product-documentation conventions with no bearing on maintenance guides.
;
; WHAT IS LEFT is what found real defects: weasel words, condescension, inclusive-language
; slips, cliches, uncomparables and spelling.
Microsoft.Units = NO
Microsoft.HeadingPunctuation = NO
Microsoft.HeadingColons = NO
proselint.Typography = NO
Microsoft.Ellipses = NO
Microsoft.Quotes = NO
Microsoft.Auto = NO
Microsoft.DateFormat = NO
Microsoft.Percentages = NO
Microsoft.Negative = NO
Microsoft.Plurals = NO
Microsoft.GeneralURL = NO
Microsoft.BiasFree = NO
Microsoft.GenderBias = NO
proselint.GenderBias = NO

; FOURTH PASS, and this one was measured in context rather than by count. All 57
; alex.Condescending findings were read with their surrounding sentence, and the rule is firing on
; correct writing:
;   * "simply" in its MERELY sense -- "it may simply be in float", "will simply refuse below it",
;     "is simply not on the circuit". Not condescending; it is ordinary English.
;   * "easy to miss", which is REASSURING phrasing on a site for people stuck at the roadside --
;     the opposite of talking down to them. Ten instances of that alone.
;   * "obvious", "clearly", "simple arithmetic", "a simple plastic drain plug" -- all descriptive.
; Exactly ONE finding in 57 was a real condescension ("a classic and easy fix, just reposition it",
; now rewritten). A rule that flags reassurance ninety-five percent of the time makes its output
; unreadable, so it comes off -- with the count recorded so nobody turns it back on assuming it
; was merely noisy.
alex.Condescending = NO

; alex.Ablist: ALL TWELVE findings are the word "special". Read at their real line numbers rather
; than inferred: "ST stands for special trailer" -- the tire industry's own name for the tire type
; -- plus "Pottery Barn Special Edition" and "special trailer tire warranty". The rule exists to
; catch "special needs" phrasing; on a site that documents ST (Special Trailer) tires it fires on
; the correct technical term every time. A rule with a measured 100% false-positive rate here.
alex.Ablist = NO

alex.Race = NO
alex.Suicide = NO
Microsoft.Terms = NO
Microsoft.UIVerbs = NO
Microsoft.We = NO

alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
alex.ProfanityLikely = NO
Microsoft.Adverbs = NO
Microsoft.HeadingAcronyms = NO
Microsoft.AMPM = NO
write-good.So = NO
write-good.ThereIs = NO
proselint.Very = NO

Microsoft.Contractions = NO
Microsoft.FirstPerson = NO
Microsoft.Passive = NO
write-good.Passive = NO
write-good.TooWordy = NO

[*.md]
; Same swap as [*.html] above: RedHat replaced Microsoft, and BOTH sections had to follow.
; The Microsoft.* = NO lines further down are left in place deliberately -- they are inert while
; the package is not synced, and they are the correct setting if it is ever brought back.
BasedOnStyles = RedHat, proselint, write-good, alex
